name: Native verification
# The heavy steps run with the cache privilege their calling job declares. A
# pull-request run may only restore caches; a main push or a manual dispatch is
# the only writer, and a job-level cache-mode has to be a literal, so
# quality.yml calls this workflow once per event with its own mode instead of
# sharing one job.
on:
  workflow_call:
    inputs:
      selected:
        description: Associated checks selected from the complete change comparison
        required: true
        type: string
      cache-only:
        description: Populate missing main build caches without executing acceptance
        type: boolean
        default: false
      save-cache:
        description: The trusted main caller may write caches
        type: boolean
        default: false
# These variables are part of the derived build cache identity.
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '1'
  CARGO_PROFILE_TEST_DEBUG: '1'
permissions:
  contents: read
jobs:
  native:
    name: ${{ inputs.cache-only && 'Cache maintenance' || 'Native' }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    # Windows cold builds plus installed acceptance reached 20 minutes before post-job cleanup.
    timeout-minutes: ${{ matrix.os == 'windows-2022' && 30 || 20 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.9.7'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Read the pinned toolchain identity
        id: toolchain-config
        shell: python
        run: |
          import os
          import pathlib
          import tomllib

          config = tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"channel={config['channel']}\n")
              output.write(f"formatter={pathlib.Path('rustfmt-toolchain').read_text().strip()}\n")
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: toolchain-cache
        with:
          path: |
            ~/.rustup/toolchains/${{ steps.toolchain-config.outputs.channel }}-*
            ~/.rustup/update-hashes/${{ steps.toolchain-config.outputs.channel }}-*
            ~/.rustup/toolchains/${{ steps.toolchain-config.outputs.formatter }}-*
            ~/.rustup/update-hashes/${{ steps.toolchain-config.outputs.formatter }}-*
          key: toolchain-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'rustfmt-toolchain') }}
      - name: Fixed Rust toolchain
        id: toolchain
        shell: python
        run: |
          import pathlib
          import subprocess
          import tomllib

          config = tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]
          command = ["rustup", "toolchain", "install", config["channel"], "--profile", config["profile"], "--no-self-update"]
          for component in config["components"]:
              command.extend(["--component", component])
          subprocess.run(command, check=True)
          formatter = pathlib.Path("rustfmt-toolchain").read_text().strip()
          subprocess.run(["rustup", "toolchain", "install", formatter, "--profile", "minimal", "--component", "rustfmt", "--no-self-update"], check=True)
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: cargo-registry
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'tests/contract-authors/*/Cargo.lock') }}
          restore-keys: cargo-registry-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Derive build cache compatibility and pinned migration
        id: build-cache-keys
        env:
          CI_CACHE_OS: ${{ matrix.os }}
          CI_CACHE_ARCH: ${{ runner.arch }}
        run: python scripts/ci-cache.py
      # A changed source revision can reuse dependency objects while Cargo still
      # validates fingerprints. Never restore source mtimes or cached test results.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: cargo-target
        with:
          lookup-only: ${{ inputs.cache-only }}
          path: |
            target
            !target/**/incremental
            !target/verification/seeds
            !target/verification/examples
          key: ${{ steps.build-cache-keys.outputs.key }}
          restore-keys: ${{ steps.build-cache-keys.outputs.restore-keys }}
      - name: Restore compatible objects for cache maintenance
        if: ${{ inputs.cache-only && steps.cargo-target.outputs.cache-hit != 'true' }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            target
            !target/**/incremental
            !target/verification/seeds
            !target/verification/examples
          key: ${{ steps.build-cache-keys.outputs.key }}
          restore-keys: ${{ steps.build-cache-keys.outputs.restore-keys }}
      - name: Record cache identity
        shell: python
        env:
          TARGET_PRIMARY_KEY: ${{ steps.cargo-target.outputs.cache-primary-key }}
          TARGET_MATCHED_KEY: ${{ steps.cargo-target.outputs.cache-matched-key }}
          TARGET_EXACT_HIT: ${{ steps.cargo-target.outputs.cache-hit }}
          REGISTRY_MATCHED_KEY: ${{ steps.cargo-registry.outputs.cache-matched-key }}
          TOOLCHAIN_EXACT_HIT: ${{ steps.toolchain-cache.outputs.cache-hit }}
        run: |
          import json
          import os
          import pathlib

          root = pathlib.Path("artifacts/ci")
          root.mkdir(parents=True, exist_ok=True)
          fields = ["TARGET_PRIMARY_KEY", "TARGET_MATCHED_KEY", "TARGET_EXACT_HIT", "REGISTRY_MATCHED_KEY", "TOOLCHAIN_EXACT_HIT", "GITHUB_SHA", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT"]
          receipt = {key: os.environ.get(key, "") for key in fields}
          planned = json.loads((root / "cache-inputs.json").read_text(encoding="utf-8"))
          receipt["legacy_build_cache_reused"] = bool(planned["legacy_candidate"] and receipt["TARGET_MATCHED_KEY"] == planned["legacy_candidate"])
          (root / "cache.json").write_text(json.dumps(receipt, indent=2) + "\n", encoding="utf-8")
      # setup-node saves a new pnpm key after the job. Cache-only runs do not
      # install dependencies, so a cold key still needs a populated store.
      - name: Populate pnpm store for cache maintenance
        if: ${{ inputs.cache-only }}
        run: node scripts/ci-run.mjs pnpm-fetch pnpm fetch --frozen-lockfile
      - name: Node development dependencies
        if: ${{ !inputs.cache-only }}
        id: node-deps
        run: node scripts/ci-run.mjs pnpm-install pnpm install --frozen-lockfile
      - name: Python development dependencies
        if: ${{ !inputs.cache-only }}
        id: python-deps
        run: node scripts/ci-run.mjs uv-sync uv sync --locked --python 3.12
      - name: Select native Git Bash on Windows
        if: runner.os == 'Windows'
        shell: python
        run: |
          import os
          import pathlib

          bash = pathlib.Path(r"C:\Program Files\Git\bin\bash.exe")
          if not bash.is_file():
              raise RuntimeError("Native Git for Windows Bash is required for process tests")
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as output:
              output.write(str(bash.parent) + "\n")
      - name: Native command failure propagation
        if: ${{ !inputs.cache-only }}
        run: node scripts/ci-run.mjs ci-runner node --test scripts/ci-run.test.mjs
      - name: Verification infrastructure and license regressions
        if: ${{ !inputs.cache-only }}
        run: node scripts/ci-run.mjs verification-tests python -m unittest discover -s scripts -p "test_*.py" -v
      - name: Dependency license preflight
        if: ${{ !inputs.cache-only }}
        run: node scripts/ci-run.mjs licenses python scripts/license_bundle.py --check --all-platforms
      - name: Clippy including independent authors
        if: ${{ !inputs.cache-only && !cancelled() && steps.node-deps.outcome == 'success' && steps.python-deps.outcome == 'success' && steps.toolchain.outcome == 'success' }}
        run: node scripts/ci-run.mjs clippy pnpm clippy:check
      - name: Git hook behavior
        id: hooks
        if: ${{ !inputs.cache-only && fromJSON(inputs.selected).hooks == true && !cancelled() && steps.node-deps.outcome == 'success' && steps.python-deps.outcome == 'success' && steps.toolchain.outcome == 'success' }}
        run: node scripts/ci-run.mjs hooks pnpm hooks:test
      # Platform sensitivity, not the crate list, decides what each runner
      # executes. These targets own the branches that really differ per OS:
      # process ownership and shell descendants, link creation, path scope and
      # history locking, private credential permissions and catalog persistence.
      # eden-fmt also verifies the pinned formatter process on each native OS.
      # The other crates are pure logic or temp-directory
      # fixtures, and their tests no longer execute off Linux; Clippy still
      # builds every target on every runner, so compilation coverage is unchanged.
      # This command's selection is declared in scripts/ci-cache.py and is part of
      # the build cache identity, so the unit graph it compiles is written back by
      # the first heavy main run instead of being rebuilt on every run;
      # scripts/test_ci_cache.py checks that this command and that declaration
      # still agree.
      - name: Platform-sensitive suites
        if: ${{ !inputs.cache-only && !cancelled() && runner.os != 'Linux' && steps.node-deps.outcome == 'success' && steps.python-deps.outcome == 'success' && steps.toolchain.outcome == 'success' }}
        run: node scripts/ci-run.mjs platform-suites cargo test --locked --no-fail-fast -p eden-process -p eden-coding-tools -p eden-search -p eden-local-history -p eden-workspace -p eden-model-access -p eden-fmt
      # Linux keeps the exact workspace command it always ran: it is the runner
      # that still executes what the other two no longer do, and a newly added
      # crate executes here. Cargo resolves features across the selected packages,
      # so Linux's own selection is part of its cache identity as well, and the
      # entry it restores is the workspace graph it builds.
      - name: Workspace suites
        if: ${{ !inputs.cache-only && !cancelled() && runner.os == 'Linux' && steps.node-deps.outcome == 'success' && steps.python-deps.outcome == 'success' && steps.toolchain.outcome == 'success' }}
        run: node scripts/ci-run.mjs workspace-suites cargo test --workspace --locked --no-fail-fast
      - name: Independent author tests
        if: ${{ !inputs.cache-only && !cancelled() && steps.node-deps.outcome == 'success' && steps.python-deps.outcome == 'success' && steps.toolchain.outcome == 'success' }}
        run: node scripts/ci-run.mjs authors pnpm rust:test:authors
      - name: Installed suites, independent authors and distribution
        if: ${{ !inputs.cache-only && !cancelled() && steps.node-deps.outcome == 'success' && steps.python-deps.outcome == 'success' && steps.toolchain.outcome == 'success' }}
        run: node scripts/ci-run.mjs installed python scripts/verify-all.py --output artifacts/verification
      - name: Build missing main cache graphs without running tests
        id: warm
        if: ${{ inputs.cache-only && steps.cargo-target.outputs.cache-hit != 'true' }}
        env:
          CI_CACHE_OS: ${{ matrix.os }}
        run: node scripts/ci-run.mjs cache-build python scripts/ci-warm.py
      - name: Package installed layout
        if: ${{ !inputs.cache-only && success() }}
        shell: bash
        run: node scripts/ci-run.mjs package tar -czf artifacts/eden-${{ runner.os }}-${{ runner.arch }}.tar.gz -C artifacts/distribution .
      - name: Verify and execute the native packaged archive
        if: ${{ !inputs.cache-only && success() }}
        run: node scripts/ci-run.mjs archive python scripts/verify-archive.py artifacts/eden-${{ runner.os }}-${{ runner.arch }}.tar.gz
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: ${{ inputs.save-cache && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !cancelled() && steps.toolchain.outcome == 'success' && steps.toolchain-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.rustup/toolchains/${{ steps.toolchain-config.outputs.channel }}-*
            ~/.rustup/update-hashes/${{ steps.toolchain-config.outputs.channel }}-*
            ~/.rustup/toolchains/${{ steps.toolchain-config.outputs.formatter }}-*
            ~/.rustup/update-hashes/${{ steps.toolchain-config.outputs.formatter }}-*
          key: ${{ steps.toolchain-cache.outputs.cache-primary-key }}
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: ${{ inputs.save-cache && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !cancelled() && steps.cargo-registry.outcome == 'success' && steps.cargo-registry.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.cargo-registry.outputs.cache-primary-key }}
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: ${{ inputs.save-cache && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && success() && (!inputs.cache-only || steps.warm.outcome == 'success') && steps.cargo-target.outcome == 'success' && steps.cargo-target.outputs.cache-hit != 'true' }}
        with:
          path: |
            target
            !target/**/incremental
            !target/verification/seeds
            !target/verification/examples
          key: ${{ steps.cargo-target.outputs.cache-primary-key }}
      - name: Require selected hook tests
        if: ${{ always() && !inputs.cache-only }}
        env:
          CI_SELECTED: ${{ inputs.selected }}
          CI_STEPS: ${{ toJson(steps) }}
        run: node scripts/ci-scope.mjs hooks-gate
      - name: Record final step outcomes
        if: always()
        shell: python
        env:
          CI_STEPS: ${{ toJson(steps) }}
        run: |
          import json
          import os
          import pathlib

          root = pathlib.Path("artifacts/ci")
          root.mkdir(parents=True, exist_ok=True)
          (root / "steps.json").write_text(os.environ["CI_STEPS"] + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Executed phase timings\n\n| Phase | Seconds | Exit | Compiling | Checking |\n| --- | ---: | ---: | ---: | ---: |\n")
              for path in sorted(root.glob("*.json")):
                  item = json.loads(path.read_text(encoding="utf-8"))
                  if "duration_seconds" in item:
                      summary.write(f"| {item['label']} | {item['duration_seconds']:.2f} | {item['exit_code']} | {item['cargo_compiling_lines']} | {item['cargo_checking_lines']} |\n")
      - name: Upload native receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.cache-only && 'cache' || 'native' }}-receipts-${{ runner.os }}-${{ runner.arch }}
          path: |
            artifacts/ci/*.json
            artifacts/verification/timings.json
            artifacts/verification/*/result.json
            artifacts/*verification.json
          if-no-files-found: error
      - name: Upload native diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.cache-only && 'cache' || 'native' }}-diagnostics-${{ runner.os }}-${{ runner.arch }}
          path: |
            artifacts/ci/*.log
            artifacts/verification
            !artifacts/verification/timings.json
            !artifacts/verification/*/result.json
          if-no-files-found: warn
      - name: Upload native archive
        if: ${{ always() && !inputs.cache-only }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-archive-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/eden-*.tar.gz
          if-no-files-found: warn

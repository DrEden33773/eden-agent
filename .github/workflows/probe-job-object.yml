name: Probe the Windows job-object test teeth and the layering timings
# Throwaway branch only; this file is never merged. The defect is applied inside
# the runner, so no defective source exists in any commit.
on:
  push:
    branches: [probe/26-job-object-teeth]
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '1'
  CARGO_PROFILE_TEST_DEBUG: '1'
jobs:
  teeth:
    name: A defective job object must fail the new smoke test
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Select native Git Bash, as the native job does
        shell: python
        run: |
          import os
          import pathlib

          bash = pathlib.Path(r"C:\Program Files\Git\bin\bash.exe")
          if not bash.is_file():
              raise RuntimeError("Native Git for Windows Bash is required for process tests")
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as output:
              output.write(str(bash.parent) + "\n")
      - name: The unmodified Windows smoke tests must pass five times
        shell: python
        run: |
          import subprocess

          command = ["cargo", "test", "-p", "eden-process", "--lib", "--locked", "windows_tests"]
          for attempt in range(5):
              subprocess.run(command, check=True)
              print(f"baseline attempt {attempt + 1} passed")
      - name: Apply one deliberate job-object defect
        shell: python
        run: |
          import pathlib

          path = pathlib.Path("crates/eden-process/src/lib.rs")
          text = path.read_text(encoding="utf-8")
          # The completion path must never stop the leader. Including it is the
          # smallest defect that breaks the exit-status contract.
          changed = text.replace("stop_members(self, false)", "stop_members(self, true)")
          if changed == text:
              raise SystemExit("the defect anchor was not found")
          path.write_text(changed, encoding="utf-8")
          print("defect applied: cleanup_descendants now stops the leader too")
      - name: The same command must fail on the defective tree
        shell: python
        run: |
          import subprocess

          result = subprocess.run(
              ["cargo", "test", "-p", "eden-process", "--lib", "--locked", "windows_tests"],
              capture_output=True,
              text=True,
          )
          print(result.stdout[-20000:])
          print(result.stderr[-4000:])
          if result.returncode == 0:
              raise SystemExit("the defective job object still passed: the smoke test is vacuous")
          if "completion_cleanup_leaves_the_leader_running" not in result.stdout:
              raise SystemExit("the run failed for a different reason than the leader-exclusion test")
          print("PROBE OK: the leader-exclusion test fails when cleanup stops the leader")
  timing:
    name: Timed phases (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Read the pinned toolchain identity
        id: toolchain-config
        shell: python
        run: |
          import os
          import pathlib
          import tomllib

          config = tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"channel={config['channel']}\n")
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: toolchain-cache
        with:
          path: |
            ~/.rustup/toolchains/${{ steps.toolchain-config.outputs.channel }}-*
            ~/.rustup/update-hashes/${{ steps.toolchain-config.outputs.channel }}-*
          key: toolchain-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: Fixed Rust toolchain
        id: toolchain
        shell: python
        run: |
          import pathlib
          import subprocess
          import tomllib

          config = tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]
          command = ["rustup", "toolchain", "install", config["channel"], "--profile", config["profile"], "--no-self-update"]
          for component in config["components"]:
              command.extend(["--component", component])
          subprocess.run(command, check=True)
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: cargo-registry
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'tests/contract-authors/*/Cargo.lock') }}
          restore-keys: cargo-registry-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Derive build cache compatibility
        id: build-cache-keys
        env:
          CI_CACHE_OS: ${{ matrix.os }}
          CI_CACHE_ARCH: ${{ runner.arch }}
        run: python scripts/ci-cache.py
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: cargo-target
        with:
          path: |
            target
            !target/**/incremental
            !target/verification/seeds
            !target/verification/examples
          key: ${{ steps.build-cache-keys.outputs.key }}
          restore-keys: ${{ steps.build-cache-keys.outputs.restore-keys }}
      - name: Time the workspace command and then the layering on one cache
        shell: python
        run: |
          import os
          import subprocess
          import time

          platform = ["cargo", "test", "--locked", "--no-fail-fast", "-p", "eden-process", "-p", "eden-coding-tools", "-p", "eden-search", "-p", "eden-local-history", "-p", "eden-workspace"]
          workspace = ["cargo", "test", "--workspace", "--locked", "--no-fail-fast"]

          def timed(label, command):
              started = time.perf_counter()
              result = subprocess.run(command, capture_output=True, text=True)
              seconds = time.perf_counter() - started
              passed = sum(
                  int(line.split()[3])
                  for line in result.stdout.splitlines()
                  if line.startswith("test result:") and line.split()[3].isdigit()
              )
              print(f"TIMING os={os.environ['RUNNER_OS']} phase={label} seconds={seconds:.1f} passed={passed} exit={result.returncode}")
              if result.returncode != 0:
                  print(result.stdout[-4000:])
                  print(result.stderr[-2000:])
                  raise SystemExit(f"{label} failed")

          timed("workspace", workspace)
          if os.environ["RUNNER_OS"] != "Linux":
              timed("platform-transition", platform)
              timed("platform-warm", platform)

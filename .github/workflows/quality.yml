name: Native quality
on:
  pull_request:
  push:
    branches: [main]
  # A squash merge can delete the head branch without delivering a main push event,
  # so the gate must also be runnable on demand for an exact main commit.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-quality-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# A pull request writes its caches under refs/pull/<n>/merge, which neither the
# base branch nor another pull request can restore, so those writes only evict
# the reusable main entries under the repository's cache quota. Reads stay
# available to every event; a main push or a manual dispatch is the only writer.
cache-mode: read
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '1'
  CARGO_PROFILE_TEST_DEBUG: '1'
jobs:
  # A main push repeats what pull-request CI already ran on the synthesized merge
  # of the reviewed head. Prove that the landed tree is that merge instead of
  # re-running the selected checks. Cache availability never expands coverage.
  prove:
    name: Main tree equivalence proof
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    outputs:
      verified: ${{ steps.proof.outputs.verified }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Prove the landed tree equals the verified merge
        id: proof
        env:
          PROOF_COMMIT: ${{ github.sha }}
          PROOF_PREVIOUS: ${{ github.event.before }}
        run: node scripts/ci-run.mjs proof node scripts/ci-proof.mjs
      - name: Upload the proof receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: proof-receipts
          path: artifacts/ci/*.json
          if-no-files-found: warn
      - name: Upload proof logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: proof-logs
          path: artifacts/ci/*.log
          if-no-files-found: warn
  scope:
    name: Select associated inputs
    runs-on: ubuntu-24.04
    outputs:
      selected: ${{ steps.scope.outputs.selected }}
      native: ${{ steps.scope.outputs.native }}
      markdown: ${{ steps.scope.outputs.markdown }}
      python: ${{ steps.scope.outputs.python }}
      javascript: ${{ steps.scope.outputs.javascript }}
      rust: ${{ steps.scope.outputs.rust }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-scope.mjs
      - name: Scope and gate regression tests
        run: node --test scripts/ci-scope.test.mjs scripts/ci-proof.test.mjs scripts/ci-run.test.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: scope-receipts
          path: artifacts/ci/*.json
          if-no-files-found: error
  lint:
    name: Selected static checks
    needs: [prove, scope]
    if: ${{ !cancelled() && needs.scope.result == 'success' && !(github.event_name == 'push' && needs.prove.result == 'success' && needs.prove.outputs.verified == 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: ${{ needs.scope.outputs.markdown == 'true' || needs.scope.outputs.javascript == 'true' }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: ${{ needs.scope.outputs.markdown == 'true' || needs.scope.outputs.javascript == 'true' }}
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: ${{ needs.scope.outputs.python == 'true' || needs.scope.outputs.rust == 'true' }}
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        if: ${{ needs.scope.outputs.python == 'true' }}
        with:
          version: '0.9.7'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Read the pinned toolchain identity
        if: ${{ needs.scope.outputs.rust == 'true' }}
        id: toolchain-config
        shell: python
        run: |
          import os
          import pathlib
          import tomllib

          config = tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"channel={config['channel']}\n")
              output.write(f"formatter={pathlib.Path('rustfmt-toolchain').read_text().strip()}\n")
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: ${{ needs.scope.outputs.rust == 'true' }}
        id: toolchain-cache
        with:
          path: |
            ~/.rustup/toolchains/${{ steps.toolchain-config.outputs.channel }}-*
            ~/.rustup/update-hashes/${{ steps.toolchain-config.outputs.channel }}-*
            ~/.rustup/toolchains/${{ steps.toolchain-config.outputs.formatter }}-*
            ~/.rustup/update-hashes/${{ steps.toolchain-config.outputs.formatter }}-*
          key: toolchain-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'rustfmt-toolchain') }}
      - name: Fixed Rust toolchain
        if: ${{ needs.scope.outputs.rust == 'true' }}
        id: toolchain
        shell: python
        run: |
          import pathlib
          import subprocess
          import tomllib

          config = tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]
          command = ["rustup", "toolchain", "install", config["channel"], "--profile", config["profile"], "--no-self-update"]
          for component in config["components"]:
              command.extend(["--component", component])
          subprocess.run(command, check=True)
          formatter = pathlib.Path("rustfmt-toolchain").read_text().strip()
          subprocess.run(["rustup", "toolchain", "install", formatter, "--profile", "minimal", "--component", "rustfmt", "--no-self-update"], check=True)
      - name: Node development dependencies
        if: ${{ needs.scope.outputs.markdown == 'true' || needs.scope.outputs.javascript == 'true' }}
        run: node scripts/ci-run.mjs pnpm-install pnpm install --frozen-lockfile
      - name: Python development dependencies
        if: ${{ needs.scope.outputs.python == 'true' }}
        run: node scripts/ci-run.mjs uv-sync uv sync --locked --python 3.12
      - name: Python formatting, Ruff and standard types
        id: python
        if: needs.scope.outputs.python == 'true'
        run: node scripts/ci-run.mjs python node scripts/checks.mjs python
      - name: JavaScript formatting and lint
        id: javascript
        if: needs.scope.outputs.javascript == 'true'
        run: node scripts/ci-run.mjs javascript pnpm js:check
      - name: Markdown
        id: markdown
        if: needs.scope.outputs.markdown == 'true'
        run: node scripts/ci-run.mjs markdown pnpm markdown:check
      - name: Build the macro formatter
        id: formatter
        if: needs.scope.outputs.rust == 'true'
        run: node scripts/ci-run.mjs eden-fmt cargo build --locked -p eden-fmt
      - name: Formatting including independent authors
        id: format
        if: needs.scope.outputs.rust == 'true'
        run: node scripts/ci-run.mjs rust-format node scripts/checks.mjs fmt
      - name: Documentation, links and rustdoc lints
        id: doc
        if: needs.scope.outputs.rust == 'true'
        run: node scripts/ci-run.mjs rust-doc node scripts/checks.mjs doc
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && steps.toolchain-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.rustup/toolchains/${{ steps.toolchain-config.outputs.channel }}-*
            ~/.rustup/update-hashes/${{ steps.toolchain-config.outputs.channel }}-*
            ~/.rustup/toolchains/${{ steps.toolchain-config.outputs.formatter }}-*
            ~/.rustup/update-hashes/${{ steps.toolchain-config.outputs.formatter }}-*
          key: ${{ steps.toolchain-cache.outputs.cache-primary-key }}
      - name: Require selected static steps
        if: always()
        env:
          CI_SELECTED: ${{ needs.scope.outputs.selected }}
          CI_STEPS: ${{ toJson(steps) }}
        run: node scripts/ci-scope.mjs static-gate
      - name: Record final step outcomes
        if: always()
        env:
          CI_STEPS: ${{ toJson(steps) }}
        run: node -e "require('node:fs').mkdirSync('artifacts/ci', {recursive:true}); require('node:fs').writeFileSync('artifacts/ci/steps.json', process.env.CI_STEPS)"
      - name: Upload static receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: static-receipts
          path: artifacts/ci/*.json
          if-no-files-found: error
      - name: Upload static logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: static-logs
          path: artifacts/ci/*.log
          if-no-files-found: warn
  # A pull request may only restore caches, and a main run is the only writer.
  # cache-mode takes a literal value, so each event calls the shared native
  # verification workflow with the privilege that event is allowed to use.
  native-pr:
    name: Native verification (pull request)
    needs: [scope, lint]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.lint.result == 'success' && needs.scope.outputs.native == 'true' }}
    cache-mode: read
    uses: ./.github/workflows/native-verify.yml
    with:
      selected: ${{ needs.scope.outputs.selected }}
  native-main:
    name: Native verification (main)
    needs: [scope, lint]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.lint.result == 'success' && needs.scope.outputs.native == 'true' }}
    cache-mode: write
    uses: ./.github/workflows/native-verify.yml
    with:
      selected: ${{ needs.scope.outputs.selected }}
  quality:
    name: Quality
    if: always()
    needs: [prove, scope, lint, native-pr, native-main]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require every selected job
        env:
          PROOF_RESULT: ${{ needs.prove.result }}
          PROOF_VERIFIED: ${{ needs.prove.outputs.verified }}
          SCOPE_RESULT: ${{ needs.scope.result }}
          CI_SELECTED: ${{ needs.scope.outputs.selected }}
          LINT_RESULT: ${{ needs.lint.result }}
          NATIVE_RESULT: ${{ github.event_name == 'pull_request' && needs.native-pr.result || needs.native-main.result }}
        run: node scripts/ci-scope.mjs gate

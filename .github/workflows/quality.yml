name: Native quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: native-quality-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '1'
  CARGO_PROFILE_TEST_DEBUG: '1'
jobs:
  lint:
    name: Static checks and scope
    runs-on: ubuntu-24.04
    outputs:
      native: ${{ steps.scope.outputs.native }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - id: scope
        name: Select required jobs from the exact PR comparison
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-scope.mjs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.9.7'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Read the pinned toolchain identity
        id: toolchain-config
        shell: python
        run: |
          import os
          import pathlib
          import tomllib

          config = tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"channel={config['channel']}\n")
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: toolchain-cache
        with:
          path: |
            ~/.rustup/toolchains/${{ steps.toolchain-config.outputs.channel }}-*
            ~/.rustup/update-hashes/${{ steps.toolchain-config.outputs.channel }}-*
          key: toolchain-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: Fixed Rust toolchain
        id: toolchain
        shell: python
        run: |
          import pathlib
          import subprocess
          import tomllib

          config = tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]
          command = ["rustup", "toolchain", "install", config["channel"], "--profile", config["profile"], "--no-self-update"]
          for component in config["components"]:
              command.extend(["--component", component])
          subprocess.run(command, check=True)
      - name: Node development dependencies
        run: node scripts/ci-run.mjs pnpm-install pnpm install --frozen-lockfile
      - name: Python development dependencies
        run: node scripts/ci-run.mjs uv-sync uv sync --locked --python 3.12
      - name: Scope and gate regression tests
        run: node scripts/ci-run.mjs ci-routing node --test scripts/ci-scope.test.mjs scripts/ci-run.test.mjs
      - name: Python formatting, Ruff and standard types
        run: node scripts/ci-run.mjs python pnpm python:check
      - name: JavaScript formatting and lint
        run: node scripts/ci-run.mjs javascript pnpm js:check
      - name: Markdown
        run: node scripts/ci-run.mjs markdown pnpm markdown:check
      - name: Formatting including independent authors
        run: node scripts/ci-run.mjs rust-format pnpm rust:check
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && steps.toolchain-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.rustup/toolchains/${{ steps.toolchain-config.outputs.channel }}-*
            ~/.rustup/update-hashes/${{ steps.toolchain-config.outputs.channel }}-*
          key: ${{ steps.toolchain-cache.outputs.cache-primary-key }}
      - name: Record final step outcomes
        if: always()
        shell: python
        env:
          CI_STEPS: ${{ toJson(steps) }}
        run: |
          import json
          import os
          import pathlib

          root = pathlib.Path("artifacts/ci")
          root.mkdir(parents=True, exist_ok=True)
          (root / "steps.json").write_text(os.environ["CI_STEPS"] + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Executed phase timings\n\n| Phase | Seconds | Exit | Compiling | Checking |\n| --- | ---: | ---: | ---: | ---: |\n")
              for path in sorted(root.glob("*.json")):
                  item = json.loads(path.read_text(encoding="utf-8"))
                  if "duration_seconds" in item:
                      summary.write(f"| {item['label']} | {item['duration_seconds']:.2f} | {item['exit_code']} | {item['cargo_compiling_lines']} | {item['cargo_checking_lines']} |\n")
      - name: Upload static diagnostics and timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: static-diagnostics
          path: artifacts/ci
          if-no-files-found: warn
  native:
    name: Native (${{ matrix.os }})
    needs: lint
    if: needs.lint.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.9.7'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Read the pinned toolchain identity
        id: toolchain-config
        shell: python
        run: |
          import os
          import pathlib
          import tomllib

          config = tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"channel={config['channel']}\n")
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: toolchain-cache
        with:
          path: |
            ~/.rustup/toolchains/${{ steps.toolchain-config.outputs.channel }}-*
            ~/.rustup/update-hashes/${{ steps.toolchain-config.outputs.channel }}-*
          key: toolchain-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: Fixed Rust toolchain
        id: toolchain
        shell: python
        run: |
          import pathlib
          import subprocess
          import tomllib

          config = tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]
          command = ["rustup", "toolchain", "install", config["channel"], "--profile", config["profile"], "--no-self-update"]
          for component in config["components"]:
              command.extend(["--component", component])
          subprocess.run(command, check=True)
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: cargo-registry
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'tests/contract-authors/*/Cargo.lock') }}
          restore-keys: cargo-registry-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Derive build cache compatibility and pinned migration
        id: build-cache-keys
        env:
          CI_CACHE_OS: ${{ matrix.os }}
          CI_CACHE_ARCH: ${{ runner.arch }}
        run: python scripts/ci-cache.py
      # A changed source revision can reuse dependency objects while Cargo still
      # validates fingerprints. Never restore source mtimes or cached test results.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: cargo-target
        with:
          path: |
            target
            !target/**/incremental
            !target/verification/seeds
          key: ${{ steps.build-cache-keys.outputs.key }}
          restore-keys: ${{ steps.build-cache-keys.outputs.restore-keys }}
      - name: Record cache identity
        shell: python
        env:
          TARGET_PRIMARY_KEY: ${{ steps.cargo-target.outputs.cache-primary-key }}
          TARGET_MATCHED_KEY: ${{ steps.cargo-target.outputs.cache-matched-key }}
          TARGET_EXACT_HIT: ${{ steps.cargo-target.outputs.cache-hit }}
          REGISTRY_MATCHED_KEY: ${{ steps.cargo-registry.outputs.cache-matched-key }}
          TOOLCHAIN_EXACT_HIT: ${{ steps.toolchain-cache.outputs.cache-hit }}
        run: |
          import json
          import os
          import pathlib

          root = pathlib.Path("artifacts/ci")
          root.mkdir(parents=True, exist_ok=True)
          fields = ["TARGET_PRIMARY_KEY", "TARGET_MATCHED_KEY", "TARGET_EXACT_HIT", "REGISTRY_MATCHED_KEY", "TOOLCHAIN_EXACT_HIT", "GITHUB_SHA", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT"]
          receipt = {key: os.environ.get(key, "") for key in fields}
          planned = json.loads((root / "cache-inputs.json").read_text(encoding="utf-8"))
          receipt["legacy_build_cache_reused"] = bool(planned["legacy_candidate"] and receipt["TARGET_MATCHED_KEY"] == planned["legacy_candidate"])
          (root / "cache.json").write_text(json.dumps(receipt, indent=2) + "\n", encoding="utf-8")
      - name: Node development dependencies
        id: node-deps
        run: node scripts/ci-run.mjs pnpm-install pnpm install --frozen-lockfile
      - name: Python development dependencies
        id: python-deps
        run: node scripts/ci-run.mjs uv-sync uv sync --locked --python 3.12
      - name: Select native Git Bash on Windows
        if: runner.os == 'Windows'
        shell: python
        run: |
          import os
          import pathlib

          bash = pathlib.Path(r"C:\Program Files\Git\bin\bash.exe")
          if not bash.is_file():
              raise RuntimeError("Native Git for Windows Bash is required for process tests")
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as output:
              output.write(str(bash.parent) + "\n")
      - name: Native command failure propagation
        run: node scripts/ci-run.mjs ci-runner node --test scripts/ci-run.test.mjs
      - name: Verification infrastructure and license regressions
        run: node scripts/ci-run.mjs verification-tests python -m unittest discover -s scripts -p "test_*.py" -v
      - name: Dependency license preflight
        run: node scripts/ci-run.mjs licenses python scripts/license_bundle.py --check --all-platforms
      - name: Clippy including independent authors
        if: ${{ !cancelled() && steps.node-deps.outcome == 'success' && steps.python-deps.outcome == 'success' && steps.toolchain.outcome == 'success' }}
        run: node scripts/ci-run.mjs clippy pnpm clippy:check
      - name: Git hook behavior
        if: ${{ !cancelled() && steps.node-deps.outcome == 'success' && steps.python-deps.outcome == 'success' && steps.toolchain.outcome == 'success' }}
        run: node scripts/ci-run.mjs hooks pnpm hooks:test
      - name: Core and native process tests
        if: ${{ !cancelled() && steps.node-deps.outcome == 'success' && steps.python-deps.outcome == 'success' && steps.toolchain.outcome == 'success' }}
        run: node scripts/ci-run.mjs core cargo test --workspace --locked --no-fail-fast
      - name: Installed suites, independent authors and distribution
        if: ${{ !cancelled() && steps.node-deps.outcome == 'success' && steps.python-deps.outcome == 'success' && steps.toolchain.outcome == 'success' }}
        run: node scripts/ci-run.mjs installed python scripts/verify-all.py --workers 2 --output artifacts/verification
      - name: Package installed layout
        shell: bash
        run: node scripts/ci-run.mjs package tar -czf artifacts/eden-${{ runner.os }}-${{ runner.arch }}.tar.gz -C artifacts/distribution .
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && steps.toolchain-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.rustup/toolchains/${{ steps.toolchain-config.outputs.channel }}-*
            ~/.rustup/update-hashes/${{ steps.toolchain-config.outputs.channel }}-*
          key: ${{ steps.toolchain-cache.outputs.cache-primary-key }}
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: ${{ !cancelled() && steps.cargo-registry.outcome == 'success' && steps.cargo-registry.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.cargo-registry.outputs.cache-primary-key }}
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: ${{ !cancelled() && steps.cargo-target.outcome == 'success' && steps.cargo-target.outputs.cache-hit != 'true' }}
        with:
          path: |
            target
            !target/**/incremental
            !target/verification/seeds
          key: ${{ steps.cargo-target.outputs.cache-primary-key }}
      - name: Record final step outcomes
        if: always()
        shell: python
        env:
          CI_STEPS: ${{ toJson(steps) }}
        run: |
          import json
          import os
          import pathlib

          root = pathlib.Path("artifacts/ci")
          root.mkdir(parents=True, exist_ok=True)
          (root / "steps.json").write_text(os.environ["CI_STEPS"] + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Executed phase timings\n\n| Phase | Seconds | Exit | Compiling | Checking |\n| --- | ---: | ---: | ---: | ---: |\n")
              for path in sorted(root.glob("*.json")):
                  item = json.loads(path.read_text(encoding="utf-8"))
                  if "duration_seconds" in item:
                      summary.write(f"| {item['label']} | {item['duration_seconds']:.2f} | {item['exit_code']} | {item['cargo_compiling_lines']} | {item['cargo_checking_lines']} |\n")
      - name: Upload native results, failure logs and timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ runner.os }}-${{ runner.arch }}
          path: |
            artifacts/ci
            artifacts/verification
            artifacts/*verification.json
            artifacts/eden-*.tar.gz
          if-no-files-found: warn
  quality:
    name: Quality
    if: always()
    needs: [lint, native]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require every selected job
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          NATIVE_REQUIRED: ${{ needs.lint.outputs.native }}
        run: node scripts/ci-scope.mjs gate

name: Native quality
on:
  pull_request:
  push:
    branches: [main]
  # A squash merge can delete the head branch without delivering a main push event,
  # so the gate must also be runnable on demand for an exact main commit.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-quality-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# A pull request writes its caches under refs/pull/<n>/merge, which neither the
# base branch nor another pull request can restore, so those writes only evict
# the reusable main entries under the repository's cache quota. Reads stay
# available to every event; a main push or a manual dispatch is the only writer.
cache-mode: read
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '1'
  CARGO_PROFILE_TEST_DEBUG: '1'
jobs:
  # A main push repeats what pull-request CI already ran on the synthesized merge
  # of the reviewed head. Prove that the landed tree is that merge instead of
  # re-running the checks, and keep the heavy jobs for the two cases the proof
  # cannot cover: no equivalence, or build caches that need a writer.
  prove:
    name: Main tree equivalence proof
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    outputs:
      verified: ${{ steps.proof.outputs.verified }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Prove the landed tree equals the verified merge
        id: proof
        env:
          PROOF_COMMIT: ${{ github.sha }}
          PROOF_PREVIOUS: ${{ github.event.before }}
        run: node scripts/ci-run.mjs proof node scripts/ci-proof.mjs
      - name: Upload the proof receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: proof
          path: artifacts/ci
          if-no-files-found: warn
  # Cache scope is per runner and includes the runner image, so only the runner
  # itself can tell whether the heavy jobs would start from a usable cache.
  cache-state:
    name: Build cache state (${{ matrix.os }})
    needs: prove
    if: ${{ !cancelled() && github.event_name == 'push' && needs.prove.outputs.verified == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Read the pinned toolchain identity
        id: toolchain-config
        shell: python
        run: |
          import os
          import pathlib
          import tomllib

          config = tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"channel={config['channel']}\n")
      - name: Derive build cache compatibility
        id: build-cache-keys
        env:
          CI_CACHE_OS: ${{ matrix.os }}
          CI_CACHE_ARCH: ${{ runner.arch }}
        run: python scripts/ci-cache.py
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: toolchain-cache
        with:
          path: |
            ~/.rustup/toolchains/${{ steps.toolchain-config.outputs.channel }}-*
            ~/.rustup/update-hashes/${{ steps.toolchain-config.outputs.channel }}-*
          key: toolchain-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}
          lookup-only: true
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: cargo-registry
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'tests/contract-authors/*/Cargo.lock') }}
          restore-keys: cargo-registry-v1-${{ runner.os }}-${{ runner.arch }}-
          lookup-only: true
      # The path list is part of the cache version, so it must match the heavy
      # job's restore byte for byte or the lookup can never find its entry. The
      # identity itself comes from the same script and the same CI_CACHE_OS value
      # the heavy job passes, so this probe looks for the entry that runner's own
      # test selection is written under.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: cargo-target
        with:
          path: |
            target
            !target/**/incremental
            !target/verification/seeds
            !target/verification/examples
          key: ${{ steps.build-cache-keys.outputs.key }}
          restore-keys: ${{ steps.build-cache-keys.outputs.restore-keys }}
          lookup-only: true
      - name: Record whether a usable build cache exists
        if: always()
        shell: python
        env:
          CACHE_OS: ${{ matrix.os }}
          TOOLCHAIN_MATCHED_KEY: ${{ steps.toolchain-cache.outputs.cache-matched-key }}
          REGISTRY_MATCHED_KEY: ${{ steps.cargo-registry.outputs.cache-matched-key }}
          TARGET_MATCHED_KEY: ${{ steps.cargo-target.outputs.cache-matched-key }}
          TARGET_EXACT_HIT: ${{ steps.cargo-target.outputs.cache-hit }}
        run: |
          import json
          import os
          import pathlib

          root = pathlib.Path("artifacts/cache-state")
          root.mkdir(parents=True, exist_ok=True)
          fields = ["TOOLCHAIN_MATCHED_KEY", "REGISTRY_MATCHED_KEY", "TARGET_MATCHED_KEY", "TARGET_EXACT_HIT"]
          receipt = {key.lower(): os.environ.get(key, "") for key in fields}
          receipt["os"] = os.environ["CACHE_OS"]
          receipt["warm"] = all(receipt[key] for key in ["toolchain_matched_key", "registry_matched_key", "target_matched_key"])
          (root / f"{receipt['os']}.json").write_text(json.dumps(receipt, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(receipt))
      - name: Upload the cache state
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cache-state-${{ matrix.os }}
          path: artifacts/cache-state
          if-no-files-found: warn
  # A missing or unreadable cache state is treated as cold, so the decision can
  # only skip the heavy jobs when every runner reported a usable cache.
  verdict:
    name: Decide whether the heavy jobs run
    needs: [prove, cache-state]
    if: ${{ !cancelled() && github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    outputs:
      heavy: ${{ steps.decide.outputs.heavy }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ needs.cache-state.result == 'success' }}
        with:
          pattern: cache-state-*
          path: artifacts/cache-state
          merge-multiple: true
      - name: Decide from the proof and the cache states
        id: decide
        if: always()
        env:
          CACHE_STATE_RESULT: ${{ needs.cache-state.result }}
        run: node scripts/ci-run.mjs cache-state node scripts/ci-scope.mjs cache-state
  lint:
    name: Static checks and scope
    needs: [prove, verdict]
    # A skipped proof or verdict must not skip the heavy jobs: `!cancelled()`
    # keeps this job eligible when a needed job was skipped for a non-push event.
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.verdict.outputs.heavy != 'false') }}
    runs-on: ubuntu-24.04
    outputs:
      native: ${{ steps.scope.outputs.native }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - id: scope
        name: Select required jobs from the exact PR comparison
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-scope.mjs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.9.7'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Read the pinned toolchain identity
        id: toolchain-config
        shell: python
        run: |
          import os
          import pathlib
          import tomllib

          config = tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"channel={config['channel']}\n")
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: toolchain-cache
        with:
          path: |
            ~/.rustup/toolchains/${{ steps.toolchain-config.outputs.channel }}-*
            ~/.rustup/update-hashes/${{ steps.toolchain-config.outputs.channel }}-*
          key: toolchain-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: Fixed Rust toolchain
        id: toolchain
        shell: python
        run: |
          import pathlib
          import subprocess
          import tomllib

          config = tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]
          command = ["rustup", "toolchain", "install", config["channel"], "--profile", config["profile"], "--no-self-update"]
          for component in config["components"]:
              command.extend(["--component", component])
          subprocess.run(command, check=True)
      - name: Node development dependencies
        run: node scripts/ci-run.mjs pnpm-install pnpm install --frozen-lockfile
      - name: Python development dependencies
        run: node scripts/ci-run.mjs uv-sync uv sync --locked --python 3.12
      - name: Scope and gate regression tests
        run: node scripts/ci-run.mjs ci-routing node --test scripts/ci-scope.test.mjs scripts/ci-proof.test.mjs scripts/ci-run.test.mjs
      - name: Python formatting, Ruff and standard types
        run: node scripts/ci-run.mjs python pnpm python:check
      - name: JavaScript formatting and lint
        run: node scripts/ci-run.mjs javascript pnpm js:check
      - name: Markdown
        run: node scripts/ci-run.mjs markdown pnpm markdown:check
      - name: Formatting including independent authors
        run: node scripts/ci-run.mjs rust-format pnpm rust:check
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && steps.toolchain-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.rustup/toolchains/${{ steps.toolchain-config.outputs.channel }}-*
            ~/.rustup/update-hashes/${{ steps.toolchain-config.outputs.channel }}-*
          key: ${{ steps.toolchain-cache.outputs.cache-primary-key }}
      - name: Record final step outcomes
        if: always()
        shell: python
        env:
          CI_STEPS: ${{ toJson(steps) }}
        run: |
          import json
          import os
          import pathlib

          root = pathlib.Path("artifacts/ci")
          root.mkdir(parents=True, exist_ok=True)
          (root / "steps.json").write_text(os.environ["CI_STEPS"] + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Executed phase timings\n\n| Phase | Seconds | Exit | Compiling | Checking |\n| --- | ---: | ---: | ---: | ---: |\n")
              for path in sorted(root.glob("*.json")):
                  item = json.loads(path.read_text(encoding="utf-8"))
                  if "duration_seconds" in item:
                      summary.write(f"| {item['label']} | {item['duration_seconds']:.2f} | {item['exit_code']} | {item['cargo_compiling_lines']} | {item['cargo_checking_lines']} |\n")
      - name: Upload static diagnostics and timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: static-diagnostics
          path: artifacts/ci
          if-no-files-found: warn
  # A pull request may only restore caches, and a main run is the only writer.
  # cache-mode takes a literal value, so each event calls the shared native
  # verification workflow with the privilege that event is allowed to use.
  native-pr:
    name: Native verification (pull request)
    needs: lint
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.lint.result == 'success' && needs.lint.outputs.native == 'true' }}
    cache-mode: read
    uses: ./.github/workflows/native-verify.yml
  native-main:
    name: Native verification (main)
    needs: lint
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.lint.result == 'success' && needs.lint.outputs.native == 'true' }}
    cache-mode: write
    uses: ./.github/workflows/native-verify.yml
  quality:
    name: Quality
    if: always()
    needs: [prove, verdict, lint, native-pr, native-main]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require every selected job
        env:
          PROOF_RESULT: ${{ needs.prove.result }}
          PROOF_VERIFIED: ${{ needs.prove.outputs.verified }}
          HEAVY_REQUIRED: ${{ needs.verdict.outputs.heavy }}
          LINT_RESULT: ${{ needs.lint.result }}
          NATIVE_RESULT: ${{ github.event_name == 'pull_request' && needs.native-pr.result || needs.native-main.result }}
          NATIVE_REQUIRED: ${{ needs.lint.outputs.native }}
        run: node scripts/ci-scope.mjs gate

[workspace]
resolver = "2"
members = ["crates/*", "plugins/*"]
exclude = ["frontend/grok", "vendor/*", "tests/contract-authors/tui-editor", "tests/contract-authors/loop-a", "tests/contract-authors/context-b", "tests/contract-authors/lifecycle"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "Apache-2.0"
repository = "https://github.com/DrEden33773/eden-agent"

[patch.crates-io]
ratatui = { path = "vendor/ratatui-0.29" }
async-openai = { git = "https://github.com/our-forks/async-openai.git", rev = "95b52ebdedf42143083cf3d6f0e0be7c84e9c808" }

[workspace.dependencies]
eden-terminal = { path = "crates/eden-terminal", version = "0.1.0" }
eden-session-workspace = { path = "crates/eden-session-workspace", version = "0.1.0" }
eden-model-input = { path = "crates/eden-model-input", version = "0.1.0" }
eden-tui = { path = "crates/eden-tui", version = "0.1.0" }
eden-tui-client = { path = "crates/eden-tui-client", version = "0.1.0" }
eden-ui-sdk = { path = "crates/eden-ui-sdk", version = "0.1.0" }
eden-presentation = { path = "crates/eden-presentation", version = "0.1.0" }
eden-process = { path = "crates/eden-process", version = "0.1.0" }
eden-protocol = { path = "crates/eden-protocol", version = "0.1.0" }
eden-plugin-sdk = { path = "crates/eden-plugin-sdk", version = "0.1.0" }
eden-kernel = { path = "crates/eden-kernel", version = "0.1.0" }
eden-agent = { path = "crates/eden-agent", version = "0.1.0" }
eden-workspace = { path = "crates/eden-workspace", version = "0.1.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process", "fs", "signal"] }
futures-util = "0.3.34"
libloading = "0.9.0"
cordis-core = "0.2.10"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
# See docs/development-checks.md#doc-comments for what has to be documented and
# what to do with an item that cannot be explained.
missing_docs = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

# Package identity hashes cover native library bytes on every open. Keep the
# compression routine optimized in development, including installed verifiers.
[profile.dev.package.sha2]
opt-level = 3

# Keep stack diagnostics inexpensive; use scripts/full-debug.mjs for debugger locals.
[profile.dev]
debug = 1

[profile.test]
debug = 1

# Shared JSON scanning and immutable catalog preparation dominate small-session startup.
# Keep the rest of the dependency graph at the ordinary development settings.
[profile.dev.package.serde_json]
opt-level = 3

[profile.dev.package.eden-protocol]
opt-level = 3

[profile.dev.package.eden-model-access]
opt-level = 2

# Prepare bindings and host replies efficiently without optimizing the imported frontend graph.
[profile.dev.package.eden-agent]
opt-level = 1

[profile.dev.package.eden-cli]
opt-level = 1

# Catalog replies cross the native boundary before bootstrap can consume their metadata.
[profile.dev.package.eden-plugin-sdk]
opt-level = 1

[profile.dev.package.eden-kernel]
opt-level = 1

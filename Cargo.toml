[workspace]
resolver = "2"
members = ["crates/*", "plugins/standard"]
exclude = ["tests/contract-authors/loop-a", "tests/contract-authors/context-b", "tests/contract-authors/lifecycle"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/DrEden33773/eden-agent"

[workspace.dependencies]
eden-protocol = { path = "crates/eden-protocol", version = "=0.1.0" }
eden-plugin-sdk = { path = "crates/eden-plugin-sdk", version = "=0.1.0" }
eden-kernel = { path = "crates/eden-kernel", version = "=0.1.0" }
eden-agent = { path = "crates/eden-agent", version = "=0.1.0" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tokio = { version = "=1.47.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
futures-util = "=0.3.31"
libloading = "=0.8.9"
cordis-core = { git = "https://github.com/dshbox/cordis-rs", rev = "0a59b29d503c24a205242d3b67fec4c6ed69c240" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

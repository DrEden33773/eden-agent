[package]
name = "eden-model-access"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
eden-plugin-sdk.workspace = true
eden-process.workspace = true
eden-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures-util.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
httpdate = "1.0.3"
aws-config = { version = "1.12.0", default-features = false, features = ["default-https-client", "rt-tokio", "sso"] }
aws-sdk-bedrockruntime = "1.145.0"
aws-smithy-types = "1.6.4"
google-cloud-auth = "1.16.0"
base64 = "0.22.1"
[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }

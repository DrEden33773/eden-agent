[project]
name = "eden-development-tools"
version = "0.0.0"
requires-python = ">=3.12"

[tool.uv]
package = false

[dependency-groups]
dev = ["ruff==0.14.3", "basedpyright==1.40.1"]

[tool.ruff]
required-version = "==0.14.3"
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "node_modules", "target", "artifacts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
pythonPlatform = "All"
failOnWarnings = true
exclude = [".venv", "node_modules", "target", "artifacts"]
executionEnvironments = [{ root = "scripts" }, { root = "." }]
